[project]
name = "homelab-mcp"
version = "0.1.0"
description = "MCP server exposing read-only homelab status tools to AI clients"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
